# Render with scripts.liberty_proxy. Replace only the three existing Liberty
# HTTP site blocks, never the ingress TLS configuration or unrelated sites.
server {
    listen 80;
    listen [::]:80;
    server_name @PORTAL_HOST@;
    client_max_body_size 110m;
    location / {
        proxy_pass http://@PUBLIC_UPSTREAM@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }
}
server {
    listen 80;
    listen [::]:80;
    server_name @PRIVATE_HOST@;
    client_max_body_size 110m;
    location ^~ /public-assets/ {
        proxy_pass http://@PUBLIC_UPSTREAM@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream off;
        proxy_request_buffering off;
        proxy_read_timeout 360s;
    }
    location / {
        add_header Cache-Control no-store always;
        return 503;
    }
}
server {
    listen 80;
    listen [::]:80;
    server_name @DEMO_HOST@;
    client_max_body_size 1k;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    location / {
        proxy_pass http://@PUBLIC_UPSTREAM@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream off;
        proxy_request_buffering off;
        proxy_read_timeout 360s;
    }
}

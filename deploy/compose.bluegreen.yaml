# Standalone, explicitly qualified images only. Never stop a private writer
# through Compose: use the identity-pinned unlimited graceful-stop controller.
name: liberty-bluegreen
services:
  public:
    image: ${LIBERTY_QUALIFIED_IMAGE:?Set the exact qualified image digest}
    command: [python, -m, uvicorn, "liberty.public_app:create_public_app", --factory, --host, 0.0.0.0, --port, "8097", --workers, "1", --no-proxy-headers, --no-access-log]
    restart: unless-stopped
    init: true
    user: "10001:10001"
    ports:
      - "${LIBERTY_BIND:-127.0.0.1}:${PUBLIC_MAINTENANCE_PORT:-18997}:8097"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the portal origin}
      EDITOR_ORIGIN: ${EDITOR_ORIGIN:?Set the private editor origin}
      DEMO_EDITOR_ORIGIN: ${DEMO_EDITOR_ORIGIN:?Set the demo editor origin}
      LIBERTY_DATA: /must-not-create-private-data
      LIBERTY_APPS: /opt/artcraft
    read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,size=32m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  candidate:
    profiles: [accounts]
    image: ${LIBERTY_QUALIFIED_IMAGE:?Set the exact qualified image digest}
    restart: "no"
    init: true
    user: "10001:10001"
    ports:
      - "${LIBERTY_BIND:-127.0.0.1}:${CANDIDATE_PORT:-19097}:8097"
      - "${LIBERTY_BIND:-127.0.0.1}:${CANDIDATE_EDITOR_PORT:-19098}:8097"
      - "${LIBERTY_BIND:-127.0.0.1}:${CANDIDATE_DEMO_PORT:-19099}:8097"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the portal origin}
      EDITOR_ORIGIN: ${EDITOR_ORIGIN:?Set the private editor origin}
      DEMO_EDITOR_ORIGIN: ${DEMO_EDITOR_ORIGIN:?Set the demo editor origin}
      LIBERTY_DATA: /data
      LIBERTY_APPS: /opt/artcraft
      GLOBAL_QUOTA_BYTES: ${GLOBAL_QUOTA_BYTES:-48318382080}
      DEFAULT_QUOTA_BYTES: ${DEFAULT_QUOTA_BYTES:-100000000}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
      MIN_FREE_BYTES: ${MIN_FREE_BYTES:-1073741824}
      PUBLIC_SIGNUP_ENABLED: ${PUBLIC_SIGNUP_ENABLED:-false}
      PUBLIC_SIGNUP_QUOTA_BYTES: ${PUBLIC_SIGNUP_QUOTA_BYTES:-100000000}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    volumes:
      - type: bind
        source: ${LIBERTY_NEXT_DATA_PATH:?Set the verified reconciled data filesystem}
        target: /data
        bind: {create_host_path: false}
    read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,size=64m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
